<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoAtMark</title>
<style>
:root { --bg:#0b101d; --bg2:#101a2e; --text:#f1f5f9; --muted:#72809a; --mint:#2ee6a8; --amber:#ffb84d; --border:rgba(255,255,255,0.1); }
* { box-sizing:border-box; }
body { margin:0; width:340px; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,sans-serif; font-size:13px; }
.head { display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--border); }
.head b { font-size:14px; } .head .mint { color:var(--mint); }
.body { padding:12px; }
textarea { width:100%; min-height:110px; background:rgba(4,8,15,0.6); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:8px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; resize:vertical; }
.actions { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
button { background:var(--bg2); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:7px 12px; cursor:pointer; font-size:12px; }
button.primary { background:var(--mint); color:#04120b; border:none; font-weight:600; }
button:hover { filter:brightness(1.1); }
#result { margin-top:10px; font-size:12px; color:var(--muted); min-height:16px; }
#result .ok { color:var(--mint); } #result .warn { color:var(--amber); }
.opt { display:flex; align-items:center; gap:6px; margin-top:10px; color:var(--muted); font-size:12px; }
.foot { padding:8px 12px; border-top:1px solid var(--border); display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
.foot a { color:var(--mint); text-decoration:none; }
</style>
</head>
<body>
  <div class="head">
    <b>noat<span class="mint">mark</span></b>
    <span style="color:var(--muted);font-size:11px">clean invisible characters</span>
  </div>
  <div class="body">
    <textarea id="input" placeholder="Paste text copied from ChatGPT, Claude, or any web page…"></textarea>
    <div class="actions">
      <button class="primary" id="clean">Clean &amp; copy</button>
      <button id="scan">Scan</button>
    </div>
    <label class="opt"><input type="checkbox" id="autoClean"> Auto-clean on copy (all pages)</label>
    <div id="result"></div>
  </div>
  <div class="foot">
    <span>free · private · in-browser</span>
    <a href="https://noatmark.com/" target="_blank" rel="noopener">more tools ↗</a>
  </div>
<script src="scan-core.js"></script>
<script src="popup.js"></script>
</body>
</html>
